<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Cricket Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#07152c,#102c4c,#07152c);
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
    text-align:center;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:22px;
    padding:35px 22px;
    box-shadow:0 15px 40px rgba(0,0,0,0.4);
}

.logo{
    width:95px;
    height:95px;
    border-radius:50%;
    background:linear-gradient(135deg,#00d4ff,#1765ff);
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0 auto 20px;
    font-size:42px;
    box-shadow:0 0 25px rgba(0,180,255,0.4);
}

h1{
    font-size:27px;
    margin-bottom:12px;
    letter-spacing:1px;
}

h1 span{
    color:#00d4ff;
}

.subtitle{
    color:#c5d5e8;
    font-size:14px;
    line-height:1.7;
    margin-bottom:25px;
}

.info{
    background:rgba(255,255,255,0.07);
    border-radius:13px;
    padding:17px;
    margin-bottom:25px;
    line-height:1.8;
    font-size:14px;
    color:#dceaff;
}

.join-btn{
    display:block;
    width:100%;
    padding:16px;
    background:linear-gradient(90deg,#0088cc,#00c6ff);
    color:white;
    text-decoration:none;
    font-size:17px;
    font-weight:bold;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,170,255,0.3);
}

.join-btn:active{
    transform:scale(0.97);
}

.footer{
    margin-top:25px;
    color:#8da6c1;
    font-size:12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">🏏</div>

    <h1>GALAXY <span>CRICKET HUB</span></h1>

    <p class="subtitle">
        Welcome To Galaxy Cricket Hub
        <br>
        Your Destination For Cricket Updates
    </p>

    <div class="info">
        🏏 Latest Cricket Updates<br>
        📊 Match Analysis & Statistics<br>
        🌍 Cricket News & Information
    </div>

    <a href="#" class="join-btn">
        JOIN TELEGRAM CHANNEL
    </a>

    <div class="footer">
        © 2026 Galaxy Cricket Hub. All Rights Reserved.
    </div>

</div>

</body>
</html>
