<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>England Royal</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#080d20,#142b50,#080d20);
color:white;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.container{
width:100%;
max-width:420px;
text-align:center;
background:rgba(255,255,255,.07);
border:1px solid rgba(255,255,255,.15);
border-radius:22px;
padding:35px 22px;
box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.logo{
width:auto;
height:100px;
border-radius:50%;
background:linear-gradient(135deg,#d8b45a,#fff0b0);
display:flex;
align-items:center;
justify-content:center;
margin:0 auto 22px;
font-size:48px;
}

h1{
font-size:29px;
margin-bottom:12px;
letter-spacing:1px;
}

h1 span{color:#e9c66b}

.subtitle{
color:#c5d5e8;
font-size:14px;
line-height:1.7;
margin-bottom:25px;
}

.info{
background:rgba(255,255,255,.07);
border-radius:13px;
padding:18px;
margin-bottom:25px;
line-height:2;
font-size:14px;
color:#e0e8f5;
}

.join-btn{
display:block;
width:100%;
padding:16px;
background:linear-gradient(90deg,#1765c5,#249cff);
color:white;
text-decoration:none;
font-size:17px;
font-weight:bold;
border-radius:12px;
}

.footer{
margin-top:25px;
color:#8da6c1;
font-size:12px;
}
</style>
</head>

<body>
<div class="container">

<div class="logo">🏏</div>

<h1>ENGLAND <span>ROYAL</span></h1>

<p class="subtitle">
Welcome To England Royal
<br>
Your Destination For Cricket Updates
</p>

<div class="info">
🏏 Latest Cricket Updates<br>
📊 Match Analysis & Statistics<br>
🌍 Cricket News & Information
</div>

<a href="#" class="join-btn">
JOIN TELEGRAM 
</a>

<div class="footer">
© 2026 England Royal. All Rights Reserved.
</div>

</div>
</body>
</html>
